<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
<rect width="100%" height="100%" fill="white"/>
<text x="60" y="71.6" font-family="Arial, sans-serif" font-size="37" font-weight="700" fill="#203441">One world point, two camera orientations</text>
<line x1="60" y1="108" x2="1440" y2="108" stroke="#00859b" stroke-width="3"/>
<text x="60" y="172.4" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#59717d">Camera [y, x] = [100, 200]     Point [y, x] = [120, 230]</text>
<text x="60" y="220.2" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#00859b">Subtract the camera: [dy, dx] = [20, 30]</text>
<text x="150.5" y="306.6" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#203441">View right on the map: a = 0 degrees</text>
<line x1="150" y1="660" x2="630" y2="660" stroke="#59717d" stroke-width="3"/>
<polygon points="630,660 617.0,654.0 617.0,666.0" fill="#59717d"/>
<line x1="390" y1="730" x2="390" y2="375" stroke="#59717d" stroke-width="3"/>
<polygon points="390,375 384.0,388.0 396.0,388.0" fill="#59717d"/>
<text x="570" y="715.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#00859b">+ side</text>
<text x="410" y="395.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#00859b">+ depth</text>
<line x1="390" y1="660" x2="490" y2="510" stroke="#3677b5" stroke-width="4"/>
<circle cx="390" cy="660" r="7" fill="#203441"/>
<circle cx="490" cy="510" r="7" fill="#cf8528"/>
<line x1="490" y1="660" x2="490" y2="510" stroke="#59717d" stroke-width="2" stroke-dasharray="9 9"/>
<line x1="390" y1="510" x2="490" y2="510" stroke="#59717d" stroke-width="2" stroke-dasharray="9 9"/>
<text x="440.0" y="489.0" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#cf8528">[20, 30]</text>
<text x="241.5" y="800.8" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#203441">Components: [side, depth]</text>
<text x="858.0" y="306.6" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#203441">View down on the map: a = 90 degrees</text>
<line x1="870" y1="660" x2="1350" y2="660" stroke="#59717d" stroke-width="3"/>
<polygon points="1350,660 1337.0,654.0 1337.0,666.0" fill="#59717d"/>
<line x1="1110" y1="730" x2="1110" y2="375" stroke="#59717d" stroke-width="3"/>
<polygon points="1110,375 1104.0,388.0 1116.0,388.0" fill="#59717d"/>
<text x="1290" y="715.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#00859b">+ side</text>
<text x="1130" y="395.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#00859b">+ depth</text>
<line x1="1110" y1="660" x2="960" y2="560" stroke="#3677b5" stroke-width="4"/>
<circle cx="1110" cy="660" r="7" fill="#203441"/>
<circle cx="960" cy="560" r="7" fill="#cf8528"/>
<line x1="960" y1="660" x2="960" y2="560" stroke="#59717d" stroke-width="2" stroke-dasharray="9 9"/>
<line x1="1110" y1="560" x2="960" y2="560" stroke="#59717d" stroke-width="2" stroke-dasharray="9 9"/>
<text x="905.0" y="539.0" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#cf8528">[-30, 20]</text>
<text x="961.5" y="800.8" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#203441">Components: [side, depth]</text>
<text x="60" y="883.2" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#203441">side = dy cos(a) - dx sin(a)      depth = dy sin(a) + dx cos(a)</text>
<text x="60" y="951.6" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#59717d">The point stays in place. Its coordinates change with the camera axes.</text>
</svg>