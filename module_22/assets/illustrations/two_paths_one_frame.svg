<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1180" viewBox="0 0 1500 1180">
<rect width="100%" height="100%" fill="white"/>
<text x="60" y="71.6" font-family="Arial, sans-serif" font-size="37" font-weight="700" fill="#203441">Two data paths, one camera, one image</text>
<line x1="60" y1="108" x2="1440" y2="108" stroke="#00859b" stroke-width="3"/>
<rect x="250" y="145" width="1000" height="110" fill="#edf5f7" stroke="#b2c5ce" stroke-width="2"/>
<text x="402.515625" y="194.0" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#203441">Input -&gt; updated camera position [y, x] and angle</text>
<text x="430.0" y="238.8" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#59717d">Both paths use the same state and projection distance d.</text>
<line x1="490" y1="255" x2="390" y2="315" stroke="#00859b" stroke-width="3"/>
<polygon points="390,315 404.23438256682823,313.45651273371743 398.06043350169796,303.1665976251669" fill="#00859b"/>
<line x1="1010" y1="255" x2="1110" y2="315" stroke="#00859b" stroke-width="3"/>
<polygon points="1110,315 1101.9395664983022,303.1665976251669 1095.7656174331719,313.45651273371743" fill="#00859b"/>
<rect x="75" y="315" width="630" height="98" fill="#eef6f8" stroke="#b2c5ce" stroke-width="2"/>
<text x="269.5" y="356.6" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#203441">Map: maze (16, 32)</text>
<text x="277.5" y="395.2" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#59717d">0 = wall; 1 = passage</text>
<line x1="390" y1="413" x2="390" y2="443" stroke="#00859b" stroke-width="3"/>
<polygon points="390,443 396.0,430.0 384.0,430.0" fill="#00859b"/>
<rect x="75" y="443" width="630" height="98" fill="#eef6f8" stroke="#b2c5ce" stroke-width="2"/>
<text x="200.5" y="484.6" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#203441">Sample points on active rays</text>
<text x="219.0" y="523.2" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#59717d">World coordinates -&gt; cell indices</text>
<line x1="390" y1="541" x2="390" y2="571" stroke="#00859b" stroke-width="3"/>
<polygon points="390,571 396.0,558.0 384.0,558.0" fill="#00859b"/>
<rect x="75" y="571" width="630" height="98" fill="#eef6f8" stroke="#b2c5ce" stroke-width="2"/>
<text x="187.0" y="612.6" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#203441">Read valid cells; detect first hit</text>
<text x="225.0" y="651.2" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#59717d">inside -&gt; walls -&gt; any + argmax</text>
<line x1="390" y1="669" x2="390" y2="699" stroke="#00859b" stroke-width="3"/>
<polygon points="390,699 396.0,686.0 384.0,686.0" fill="#00859b"/>
<rect x="75" y="699" width="630" height="98" fill="#eef6f8" stroke="#b2c5ce" stroke-width="2"/>
<text x="199.5" y="740.6" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#203441">Results for every original ray</text>
<text x="229.5" y="779.2" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#59717d">end_distance, has_wall: (100,)</text>
<line x1="390" y1="797" x2="390" y2="827" stroke="#00859b" stroke-width="3"/>
<polygon points="390,827 396.0,814.0 384.0,814.0" fill="#00859b"/>
<rect x="75" y="827" width="630" height="98" fill="#eef6f8" stroke="#b2c5ce" stroke-width="2"/>
<text x="221.5" y="868.6" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#203441">Screen stripes and colors</text>
<text x="194.5" y="907.2" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#59717d">depth = r cos(a); height = H d / depth</text>
<rect x="795" y="315" width="630" height="98" fill="#f0f4fa" stroke="#b2c5ce" stroke-width="2"/>
<text x="977.0" y="356.6" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#203441">World grid: (50, 2, 2)</text>
<text x="955.515625" y="395.2" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#59717d">Segment -&gt; endpoint -&gt; [y, x]</text>
<line x1="1110" y1="413" x2="1110" y2="443" stroke="#00859b" stroke-width="3"/>
<polygon points="1110,443 1116.0,430.0 1104.0,430.0" fill="#00859b"/>
<rect x="795" y="443" width="630" height="98" fill="#f0f4fa" stroke="#b2c5ce" stroke-width="2"/>
<text x="909.0" y="484.6" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#203441">Change to camera coordinates</text>
<text x="887.0" y="523.2" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#59717d">Subtract position; calculate side and depth</text>
<line x1="1110" y1="541" x2="1110" y2="571" stroke="#00859b" stroke-width="3"/>
<polygon points="1110,571 1116.0,558.0 1104.0,558.0" fill="#00859b"/>
<rect x="795" y="571" width="630" height="98" fill="#f0f4fa" stroke="#b2c5ce" stroke-width="2"/>
<text x="901.0" y="612.6" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#203441">Clip before perspective division</text>
<text x="892.0" y="651.2" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#59717d">Keep depth &gt;= near; replace hidden ends</text>
<line x1="1110" y1="669" x2="1110" y2="699" stroke="#00859b" stroke-width="3"/>
<polygon points="1110,699 1116.0,686.0 1104.0,686.0" fill="#00859b"/>
<rect x="795" y="699" width="630" height="98" fill="#f0f4fa" stroke="#b2c5ce" stroke-width="2"/>
<text x="911.5" y="740.6" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#203441">Project the retained endpoints</text>
<text x="950.0" y="779.2" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#59717d">[screen_x, screen_y]: (K, 2, 2)</text>
<line x1="1110" y1="797" x2="1110" y2="827" stroke="#00859b" stroke-width="3"/>
<polygon points="1110,827 1116.0,814.0 1104.0,814.0" fill="#00859b"/>
<rect x="795" y="827" width="630" height="98" fill="#f0f4fa" stroke="#b2c5ce" stroke-width="2"/>
<text x="899.5" y="868.6" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#203441">Screen segments, ready to draw</text>
<text x="906.5" y="907.2" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#59717d">K &lt;= 50; world geometry is unchanged</text>
<line x1="390" y1="925" x2="610" y2="990" stroke="#00859b" stroke-width="3"/>
<polygon points="610,990 599.2328466413387,980.5623939184203 595.83269294913,992.0706064151271" fill="#00859b"/>
<line x1="1110" y1="925" x2="890" y2="990" stroke="#00859b" stroke-width="3"/>
<polygon points="890,990 904.16730705087,992.0706064151271 900.7671533586613,980.5623939184203" fill="#00859b"/>
<rect x="160" y="990" width="1180" height="115" fill="#e1f0ed" stroke="#b2c5ce" stroke-width="2"/>
<text x="384.015625" y="1041.0" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#203441">Draw: ceiling -&gt; floor -&gt; grid -&gt; walls -&gt; display.flip()</text>
<text x="489.5" y="1083.8" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#59717d">Drawing walls last hides the grid behind them.</text>
</svg>